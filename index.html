<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DataPulse Suite Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #09090b; color: #f4f4f5; }
    .glass { background: rgba(20, 20, 23, 0.85); backdrop-filter: blur(14px); border: 1px solid rgba(63, 63, 70, 0.3); }
    
    /* ESTILOS EDITORIALES PREMIUM PARA EL REPORTE DE IA */
    .ai-render h1 { color: #c084fc; font-size: 1.6rem; font-weight: 800; tracking-tight: -0.025em; border-bottom: 1px solid rgba(168, 85, 247, 0.3); padding-bottom: 0.5rem; margin-top: 1.5rem; margin-bottom: 1rem; }
    .ai-render h2 { color: #a855f7; font-size: 1.25rem; font-weight: 700; margin-top: 1.5rem; margin-bottom: 0.75rem; display: flex; items-center: center; gap: 0.5rem; }
    .ai-render h3 { color: #e4e4e7; font-size: 1.05rem; font-weight: 600; margin-top: 1rem; margin-bottom: 0.5rem; border-left: 3px solid #a855f7; padding-left: 8px; }
    .ai-render p { margin-bottom: 0.75rem; color: #a1a1aa; line-height: 1.6; font-size: 0.9rem; }
    .ai-render ul { list-style-type: disc; margin-left: 1.25rem; margin-bottom: 1rem; color: #d4d4d8; space-y: 0.25rem; }
    .ai-render li { font-size: 0.875rem; line-height: 1.5; }
    .ai-render strong { color: #ffffff; font-weight: 600; }
    .ai-render table { w-full: 100%; text-align: left; font-size: 0.8rem; margin: 1rem 0; border-collapse: collapse; background: rgba(24, 24, 27, 0.5); border-radius: 12px; overflow: hidden; border: 1px solid rgba(63, 63, 70, 0.4); }
    .ai-render th { background: #18181b; padding: 0.75rem; text-transform: uppercase; font-weight: 600; color: #a1a1aa; border-bottom: 1px solid rgba(63, 63, 70, 0.4); }
    .ai-render td { padding: 0.75rem; border-bottom: 1px solid rgba(39, 39, 42, 0.5); color: #e4e4e7; }
    .ai-render tr:hover { background: rgba(39, 39, 42, 0.3); }
    .ai-render hr { border-color: rgba(63, 63, 70, 0.3); margin: 1.5rem 0; }
  </style>
</head>
<body class="antialiased min-h-screen pb-16 md:pb-0">

  <!-- VISTA: LOGIN -->
  <div id="view-login" class="flex items-center justify-center min-h-screen px-4">
